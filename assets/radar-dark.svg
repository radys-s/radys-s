<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-labelledby="title"><title id="title">radar portfolio illustration</title><style>:root{--bg:#0d1522;--ink:#e8f0fa;--muted:#8ca4bd;--line:#23374d;--cyan:#63d8df;--blue:#68a2ff;--wash:#16374a;--panel:#111e30}text{font-family:Segoe UI,Arial,sans-serif;fill:var(--ink)}.label{font:11px Consolas,monospace;letter-spacing:2px;fill:var(--muted)}.caption{font-size:13px;fill:var(--muted)}.line{fill:none;stroke:var(--line);stroke-width:1.5}.accent{fill:none;stroke:var(--cyan);stroke-width:2}.flow{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:10 100;animation:flow 9s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.drift{animation:drift 14s ease-in-out infinite alternate}.rotate{transform-origin:620px 78px;animation:rotate 12s linear infinite}.tile{animation:tile 8s ease-in-out infinite}.mode{animation:mode 12s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-440}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes drift{to{transform:translate(-24px,12px)}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes tile{0%,100%{fill:var(--panel)}45%{fill:var(--wash);stroke:var(--cyan)}}@keyframes mode{0%,28%{opacity:1}34%,94%{opacity:.15}100%{opacity:1}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.secondary{display:none}.first{opacity:1!important;clip-path:none!important}}</style><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="var(--line)" stroke-width=".5"/></pattern><linearGradient id="g"><stop stop-color="var(--blue)" stop-opacity=".15"/><stop offset="1" stop-color="var(--cyan)" stop-opacity=".04"/></linearGradient></defs><rect x=".5" y=".5" width="839" height="149" rx="14" fill="var(--bg)" stroke="var(--line)"/><rect x="1" y="1" width="838" height="148" rx="14" fill="url(#grid)" opacity=".55"/><text x="30" y="39" class="label">03 / NETWORK TOOL</text><text x="30" y="87" font-size="24" font-weight="600">Signals into a clearer picture.</text><text x="30" y="115" class="caption">Observe · calibrate · estimate</text><circle cx="620" cy="78" r="25" class="line"/><circle cx="620" cy="78" r="46" class="line"/><circle cx="620" cy="78" r="65" class="line"/><path d="M548 78H692M620 7V149" class="line"/><g class="rotate"><path d="M620 78L620 13A65 65 0 0 1 676 45Z" fill="var(--cyan)" opacity=".1"/><path d="M620 78V13" class="accent"/></g><g class="pulse" style="animation-delay:-0s"><circle cx="590" cy="52" r="4" fill="var(--bg)" stroke="var(--cyan)" stroke-width="2"/><circle cx="590" cy="52" r="10" fill="var(--cyan)" opacity=".15"/></g><g class="pulse" style="animation-delay:-1.7s"><circle cx="654" cy="97" r="4" fill="var(--bg)" stroke="var(--cyan)" stroke-width="2"/><circle cx="654" cy="97" r="10" fill="var(--cyan)" opacity=".15"/></g><g class="pulse" style="animation-delay:-3.4s"><circle cx="603" cy="119" r="4" fill="var(--bg)" stroke="var(--cyan)" stroke-width="2"/><circle cx="603" cy="119" r="10" fill="var(--cyan)" opacity=".15"/></g></svg>
