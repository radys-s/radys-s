<svg xmlns="http://www.w3.org/2000/svg" width="420" height="40" viewBox="0 0 420 40" role="img" aria-labelledby="title"><title id="title">subtitle portfolio illustration</title><style>:root{--bg:#f5f9fd;--ink:#182d44;--muted:#506780;--line:#cbdbe9;--cyan:#087e87;--blue:#2767c6;--wash:#dceff3;--panel:#eaf2fa}text{font-family:Segoe UI,Arial,sans-serif;fill:var(--ink)}.label{font:11px Consolas,monospace;letter-spacing:2px;fill:var(--muted)}.caption{font-size:13px;fill:var(--muted)}.line{fill:none;stroke:var(--line);stroke-width:1.5}.accent{fill:none;stroke:var(--cyan);stroke-width:2}.flow{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:10 100;animation:flow 9s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.drift{animation:drift 14s ease-in-out infinite alternate}.rotate{transform-origin:620px 78px;animation:rotate 12s linear infinite}.tile{animation:tile 8s ease-in-out infinite}.mode{animation:mode 12s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-440}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes drift{to{transform:translate(-24px,12px)}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes tile{0%,100%{fill:var(--panel)}45%{fill:var(--wash);stroke:var(--cyan)}}@keyframes mode{0%,28%{opacity:1}34%,94%{opacity:.15}100%{opacity:1}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.secondary{display:none}.first{opacity:1!important;clip-path:none!important}}</style><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="var(--line)" stroke-width=".5"/></pattern><linearGradient id="g"><stop stop-color="var(--blue)" stop-opacity=".15"/><stop offset="1" stop-color="var(--cyan)" stop-opacity=".04"/></linearGradient></defs><style>.phrase{font:20px Consolas,monospace;fill:var(--cyan);opacity:0;animation:phrase 15s infinite}.first{opacity:1}@keyframes phrase{0%{opacity:1;clip-path:inset(0 100% 0 0)}6%,29%{opacity:1;clip-