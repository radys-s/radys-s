<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-labelledby="title"><title id="title">prizma portfolio illustration</title><style>:root{--bg:#f5f9fd;--ink:#182d44;--muted:#506780;--line:#cbdbe9;--cyan:#087e87;--blue:#2767c6;--wash:#dceff3;--panel:#eaf2fa}text{font-family:Segoe UI,Arial,sans-serif;fill:var(--ink)}.label{font:11px Consolas,monospace;letter-spacing:2px;fill:var(--muted)}.caption{font-size:13px;fill:var(--muted)}.line{fill:none;stroke:var(--line);stroke-width:1.5}.accent{fill:none;stroke:var(--cyan);stroke-width:2}.flow{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:10 100;animation:flow 9s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.drift{animation:drift 14s ease-in-out infinite alternate}.rotate{transform-origin:620px 78px;animation:rotate 12s linear infinite}.tile{animation:tile 8s ease-in-out infinite}.mode{animation:mode 12s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-440}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes drift{to{transform:translate(-24px,12px)}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes tile{0%,100%{fill:var(--panel)}45%{fill:var(--wash);stroke:var(--cyan)}}@keyframes mode{0%,28%{opacity:1}34%,94%{opacity:.15}100%{opacity:1}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.secondary{display:none}.first{opacity:1!important;clip-path:none!important}}</style><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="var(--line)" stroke-width=".5"/></pattern><linearGradient id="g"><stop stop-color="var(--blue)" stop-opacity=".15"/><stop offset="1" stop-color="var(--cyan)" stop-opacity=".04"/></linearGradient></defs><rect x=".5" y=".5" width="839" height="149" rx="14" fill="var(--bg)" stroke="var(--line)"/><rect x="1" y="1" width="838" height="148" rx="14" fill="url(#grid)" opacity=".55"/><text x="30" y="39" class="label">01 / LANGUAGE MODELS</text><text x="30" y="87" font-size="24" font-weight="600">One prompt. Several paths.</text><text x="30" y="115" class="caption">Plan → route → respond</text><path d="M426 76H547M590 76L730 34M590 76H750M590 76L730 118" class="line"/><path d="M426 76H547M590 76L730 34M590 76H750M590 76L730 118" class="flow"/><path d="M548 105L570 42L599 105Z" fill="var(--wash)" stroke="var(--cyan)" stroke-width="2"/><circle cx="426" cy="76" r="5" fill="var(--bg)" stroke="var(--cyan)" stroke-width="2"/><rect x="731" y="22" width="48" height="24" rx="6" fill="var(--panel)" stroke="var(--blue)" class="pulse" style="animation-delay:-0s"/><rect x="731" y="64" width="48" height="24" rx="6" fill="var(--panel)" stroke="var(--blue)" class="pulse" style="animation-delay:-2s"/><rect x="731" y="106" width="48" height="24" rx="6" fill="var(--panel)" stroke="var(--blue)" class="pulse" style="animation-delay:-4s"/></svg>
