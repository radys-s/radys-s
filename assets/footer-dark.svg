<svg xmlns="http://www.w3.org/2000/svg" width="840" height="40" viewBox="0 0 840 40" role="img" aria-labelledby="title"><title id="title">footer portfolio illustration</title><style>:root{--bg:#0d1522;--ink:#e8f0fa;--muted:#8ca4bd;--line:#23374d;--cyan:#63d8df;--blue:#68a2ff;--wash:#16374a;--panel:#111e30}text{font-family:Segoe UI,Arial,sans-serif;fill:var(--ink)}.label{font:11px Consolas,monospace;letter-spacing:2px;fill:var(--muted)}.caption{font-size:13px;fill:var(--muted)}.line{fill:none;stroke:var(--line);stroke-width:1.5}.accent{fill:none;stroke:var(--cyan);stroke-width:2}.flow{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:10 100;animation:flow 9s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.drift{animation:drift 14s ease-in-out infinite alternate}.rotate{transform-origin:620px 78px;animation:rotate 12s linear infinite}.tile{animation:tile 8s ease-in-out infinite}.mode{animation:mode 12s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-440}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes drift{to{transform:translate(-24px,12px)}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes tile{0%,100%{fill:var(--panel)}45%{fill:var(--wash);stroke:var(--cyan)}}@keyframes mode{0%,28%{opacity:1}34%,94%{opacity:.15}100%{opacity:1}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.secondary{display:none}.first{opacity:1!important;clip-path:none!important}}</style><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="var(--line)" stroke-width=".5"/></pattern><linearGradient id="g"><stop stop-color="var(--blue)" stop-opacity=".15"/><stop offset="1" stop-color="var(--cyan)" stop-opacity=".04"/></linearGradient></defs><path d="M0 20H840" class="line"/><path d="M0 20H840" class="flow" style="stroke-dasharray:65 775;animation-duration:16s"/><circle cx="420" cy="20" r="4" fill="var(--cyan)" class="pulse"/></svg>
